# Evaluation set for the 5 sample documents in data/raw/.
#
# id      unique id (prefix = category)
# q       the question
# type    graph | vector | hybrid | ambiguous | guard   (what kind of question it is)
# route   ideal route for "auto"; a list means "all of these are acceptable, first is ideal"
# hops    1 = one fact, 2 = needs two or more connected facts (multi-hop)
# a       keywords a correct answer must contain; every item must match, "x|y" = either
# guard   expected early exit: smalltalk | off_topic | blocked
# not_found  true = the documents do NOT contain the answer; the correct reply is the
#            canned "couldn't find" message (tests hallucination)
#
# Route is judged by what the answer needs, not by what the router happens to do:
# the graph holds relationships only (no dates, amounts, descriptions), so those need documents.

