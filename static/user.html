<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{APP_NAME}}</title>
  <link rel="stylesheet" href="/static/user.css">
  <link rel="stylesheet" href="/static/upload.css">
  <script src="/static/upload.js" defer></script>
  <script src="/static/user.js" defer></script>
</head>
<body>
<div class="shell" id="shell">
  <aside id="side" class="side" aria-label="Your documents">
    <div class="side-in">
      <div class="side-head">
        <h2>Documents <span id="doc-count" class="count">0</span></h2>
        <button type="button" id="side-close" class="icon" aria-label="Hide documents panel">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <label class="switch"><input type="checkbox" id="do-graph" checked>
        <span>Build the knowledge graph <small>(slower, better for "who is connected to what")</small></span></label>

      <label class="drop" id="drop" for="files">
        <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M12 16V5m0 0l-4 4m4-4l4 4M5 19h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <b>Drop files here</b>
        <span>or click to browse<br>.txt .md .pdf · up to 5 MB each</span>
      </label>
      <input type="file" id="files" class="sr" accept=".txt,.md,.pdf" multiple>

      <div id="upload-out" aria-live="polite"></div>

      <ul id="doc-list" class="doc-list" aria-label="Uploaded documents"></ul>
      <p id="doc-empty" class="muted small">Nothing uploaded yet.</p>
    </div>
  </aside>
  <div id="scrim" class="scrim" hidden></div>

  <main class="main">
    <header class="top">
      <button type="button" id="side-open" class="icon" aria-label="Show documents panel" aria-controls="side" aria-expanded="true">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="titles">
        <h1>{{APP_NAME}}</h1>
        <p class="muted small">{{APP_TAGLINE}}</p>
        <p id="warm" class="warm small" hidden></p>
      </div>
      <button type="button" id="clear" class="ghost">Clear chat</button>
    </header>

    <section id="chat" class="chat" aria-live="polite" aria-label="Conversation">
      <div id="empty" class="empty">
        <p id="empty-text">Add documents on the left, then ask a question below.</p>
        <div id="chips" class="chips" aria-label="Example questions"></div>
      </div>
    </section>

    <form id="ask-form" class="composer" autocomplete="off">
      <label for="question" class="sr">Your question</label>
      <textarea id="question" rows="2" maxlength="{{MAX_QUESTION_CHARS}}" required placeholder="Ask a question about your documents…"></textarea>
      <div class="controls">
        <label class="field">Method
          <select id="route">
            <option value="auto" selected>Auto (picks the best method)</option>
            <option value="graph">Graph (relationships)</option>
            <option value="vector">Vector (matching passages)</option>
            <option value="hybrid">Hybrid (both)</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="compare"> Compare vector and graph</label>
        <button type="submit" id="ask-btn" class="primary">Ask</button>
      </div>
    </form>
  </main>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="veil" class="veil" hidden><div>Drop files to upload</div></div>
</body>
</html>
